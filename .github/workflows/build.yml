name: Build ImmortalWrt via ImageBuilder for CMCC XR30

on:
  workflow_dispatch:
  schedule:
    - cron: '0 20 * * 0' # 每周一凌晨 04:00 (北京时间) 自动巡检构建并发布最新版本固件
  push:
    branches:
      - main
      - snapshot

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IB_URL: https://downloads.immortalwrt.org/snapshots/targets/mediatek/filogic/immortalwrt-imagebuilder-mediatek-filogic.Linux-x86_64.tar.zst
  TZ: Asia/Shanghai

permissions:
  contents: write

jobs:
  build:
    name: Build via ImageBuilder
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set build variables
        id: vars
        run: |
          echo "build_date=$(date +'%Y.%m.%d')" >> $GITHUB_OUTPUT

      - name: Install build tools
        run: |
          sudo apt-get -qq update
          sudo apt-get -qq install zstd libssl-dev libncurses-dev jq device-tree-compiler

      - name: Download official ImageBuilder
        run: |
          echo "Downloading official ImageBuilder..."
          curl -sL --retry 3 --connect-timeout 10 \
            "${{ env.IB_URL }}" -o ib.tar.zst
          tar -I zstd -xf ib.tar.zst
          rm -f ib.tar.zst
          IB_DIR=$(ls -d immortalwrt-imagebuilder-*)
          echo "IB_DIR=$IB_DIR" >> $GITHUB_ENV
          echo "Extracted to $IB_DIR"

      - name: Inject XR30 profile and device tree
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x "$GITHUB_WORKSPACE/scripts/inject_xr30.sh"
          "$GITHUB_WORKSPACE/scripts/inject_xr30.sh" "$IB_DIR" "$GITHUB_WORKSPACE/dts/mt7981b-cmcc-xr30-nand.dtso"

      - name: Build Firmware via ImageBuilder
        run: |
          cd "$IB_DIR"

          find "$GITHUB_WORKSPACE/files" -type f -exec chmod +x {} + 2>/dev/null || true

          PACKAGES_LIST="kmod-dummy kmod-nft-socket kmod-nft-tproxy kmod-tun kmod-inet-diag kmod-netlink-diag kmod-tcp-bbr kmod-usb3 kmod-usb-storage kmod-usb-storage-uas kmod-fs-ext4 kmod-fs-vfat kmod-fs-exfat automount luci luci-i18n-base-zh-cn luci-i18n-firewall-zh-cn luci-i18n-package-manager-zh-cn luci-theme-argon luci-app-ttyd luci-i18n-ttyd-zh-cn curl ca-bundle ip-full momo luci-app-momo luci-i18n-momo-zh-cn sing-box"

          echo "Packaging firmware with USB 3.0, UAS, Momo and Sing-box..."
          make image PROFILE=cmcc_rax3000m \
            PACKAGES="$PACKAGES_LIST" \
            FILES="$GITHUB_WORKSPACE/files"

      - name: Prepare Release Artifacts
        run: |
          mkdir -p release
          OUTPUT_DIR=$(find "$IB_DIR"/bin -type d -name "filogic" | head -n 1)
          echo "Output directory: $OUTPUT_DIR"
          cd "$OUTPUT_DIR"

          echo "Generated raw files:"
          ls -la *rax3000m* 2>/dev/null || true

          # 只保留 sysupgrade.itb + manifest，滤除 eMMC 引导产物（XR30 为 NAND 设备，bootloader 归 bl-mt798x-xr30 仓库管）
          for f in *rax3000m-squashfs-sysupgrade.itb *rax3000m.manifest; do
            [ -f "$f" ] || continue
            TARGET_NAME=$(echo "$f" | sed 's/cmcc_rax3000m/cmcc_xr30-nand/g')
            cp -v "$f" "$GITHUB_WORKSPACE/release/$TARGET_NAME"
          done

          cd "$GITHUB_WORKSPACE/release"

          # 校验生成的固件元数据，保证 sysupgrade 零拦截
          FWTOOL=$(find "$GITHUB_WORKSPACE/$IB_DIR"/staging_dir/host/bin -name "fwtool" 2>/dev/null | head -n 1)
          if [ -x "$FWTOOL" ]; then
            for itb in *.itb; do
              [ -f "$itb" ] || continue
              echo "Inspecting verified metadata for $itb:"
              "$FWTOOL" -q -i /dev/stdout "$itb" || true
            done
          fi

          sha256sum * > sha256sums

          # 内容寻址: tag 由上游 rev 决定,同一上游内容重复构建时原地更新既有 Release (不产生新条目)
          # 优先从产物文件名提取;上游改名无前缀时,从官方 profiles.json 的 version_code 兑底
          UPREV=$(ls | grep -oP '(?<=snapshot-)r[0-9]+-[0-9a-f]+' | head -n 1)
          if [ -z "$UPREV" ]; then
            UPREV=$(curl -sL --retry 3 "https://downloads.immortalwrt.org/snapshots/targets/mediatek/filogic/profiles.json" | grep -oP '(?<="version_code":")[^"]+' | head -n 1)
          fi
          if [ -z "$UPREV" ]; then echo "Error: upstream rev not found!"; exit 1; fi
          echo "release_tag=snapshot-${UPREV}" >> "$GITHUB_ENV"
          echo "Upstream rev: ${UPREV} -> release_tag=snapshot-${UPREV}"
          ls -la

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.release_tag }}
          name: "ImmortalWrt 26.x Snapshot for CMCC XR30 (${{ env.release_tag }} · ${{ steps.vars.outputs.build_date }})"
          body: |
            - **设备**: 中国移动 CMCC XR30 (MT7981B / 512MB DDR4 / 128MB SPI-NAND)
            - **上游**: ImmortalWrt master 主干 (26.x, Linux 6.18)，官方 ImageBuilder 打包，本仓库仅做设备适配
            - **适配**: RAX3000M NAND DTB + 增量 overlay (fdtoverlay)；board 脚本实时拉取上游并注入 cmcc,xr30*
            - **内置**: Momo + sing-box（Dashboard 全节点自动测速） · LuCI + Argon + TTYD · USB 3.0 自动挂载 · PPE 硬件分载 / BBR
            - **刷写**: U-Boot Web (192.168.1.1) 上传 itb，或 `sysupgrade -n *.itb`
            - **回退**: [25.12 稳定通道](https://github.com/RSxiaoyu/immortalwrt-xr30/releases?q=25.12) 可直接互刷
          files: release/*
