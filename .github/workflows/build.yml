name: Build ImmortalWrt via ImageBuilder for CMCC XR30

on:
  workflow_dispatch:
  schedule:
    - cron: '0 20 * * 0' # 每周一凌晨 04:00 (北京时间) 自动巡检构建并发布最新版本固件
  push:
    branches:
      - main
      - snapshot

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IB_URL: https://downloads.immortalwrt.org/snapshots/targets/mediatek/filogic/immortalwrt-imagebuilder-mediatek-filogic.Linux-x86_64.tar.zst
  TZ: Asia/Shanghai

permissions:
  contents: write

jobs:
  build:
    name: Build via ImageBuilder
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set build variables
        id: vars
        run: |
          echo "build_date=$(date +'%Y.%m.%d')" >> $GITHUB_OUTPUT
          echo "release_tag=v26-snapshot-$(date +'%Y%m%d%H%M')" >> $GITHUB_OUTPUT

      - name: Install build tools
        run: |
          sudo apt-get -qq update
          sudo apt-get -qq install zstd libssl-dev libncurses-dev device-tree-compiler

      - name: Download official ImageBuilder
        run: |
          echo "Downloading official ImageBuilder..."
          curl -sL --retry 3 --connect-timeout 10 \
            "${{ env.IB_URL }}" -o ib.tar.zst
          tar -I zstd -xf ib.tar.zst
          rm -f ib.tar.zst
          IB_DIR=$(ls -d immortalwrt-imagebuilder-*)
          echo "IB_DIR=$IB_DIR" >> $GITHUB_ENV
          echo "Extracted to $IB_DIR"

      - name: Inject XR30 profile and device tree
        run: |
          chmod +x "$GITHUB_WORKSPACE/scripts/inject_xr30.sh"
          "$GITHUB_WORKSPACE/scripts/inject_xr30.sh" "$IB_DIR" "$GITHUB_WORKSPACE/dts/mt7981b-cmcc-xr30-nand.dtso"

      - name: Build Firmware via ImageBuilder
        run: |
          cd "$IB_DIR"

          find "$GITHUB_WORKSPACE/files" -type f -exec chmod +x {} + 2>/dev/null || true

          PACKAGES_LIST="kmod-nft-socket kmod-nft-tproxy kmod-tun kmod-tcp-bbr kmod-usb3 kmod-usb-storage kmod-usb-storage-uas kmod-fs-ext4 kmod-fs-vfat kmod-fs-exfat automount luci luci-i18n-base-zh-cn luci-i18n-package-manager-zh-cn luci-theme-argon luci-app-ttyd luci-i18n-ttyd-zh-cn curl ca-bundle ip-full luci-app-homeproxy luci-i18n-homeproxy-zh-cn"

          echo "Packaging firmware with USB 3.0, UAS and HomeProxy..."
          make image PROFILE=cmcc_rax3000m \
            PACKAGES="$PACKAGES_LIST" \
            FILES="$GITHUB_WORKSPACE/files"

      - name: Prepare Release Artifacts
        run: |
          mkdir -p release
          OUTPUT_DIR=$(find "$IB_DIR"/bin -type d -name "filogic" | head -n 1)
          echo "Output directory: $OUTPUT_DIR"
          cd "$OUTPUT_DIR"

          echo "Generated raw files:"
          ls -la *rax3000m* 2>/dev/null || true

          # 只保留 sysupgrade.itb + manifest，滤除 eMMC 引导产物（XR30 为 NAND 设备，bootloader 归 bl-mt798x-xr30 仓库管）
          for f in *rax3000m-squashfs-sysupgrade.itb *rax3000m.manifest; do
            [ -f "$f" ] || continue
            TARGET_NAME=$(echo "$f" | sed 's/cmcc_rax3000m/cmcc_xr30-nand/g')
            cp -v "$f" "$GITHUB_WORKSPACE/release/$TARGET_NAME"
          done

          cd "$GITHUB_WORKSPACE/release"

          # 校验生成的固件元数据，保证 sysupgrade 零拦截
          FWTOOL=$(find "$GITHUB_WORKSPACE/$IB_DIR"/staging_dir/host/bin -name "fwtool" 2>/dev/null | head -n 1)
          if [ -x "$FWTOOL" ]; then
            for itb in *.itb; do
              [ -f "$itb" ] || continue
              echo "Inspecting verified metadata for $itb:"
              "$FWTOOL" -q -i /dev/stdout "$itb" || true
            done
          fi

          sha256sum * > sha256sums
          ls -la

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.vars.outputs.release_tag }}
          make_latest: true # 默认分支/主线通道，Release 恒置顶
          name: "ImmortalWrt 26.x Snapshot for CMCC XR30 (${{ steps.vars.outputs.build_date }})"
          body: |
            ### 固件信息
            - **适用设备**: 中国移动 CMCC XR30 (MT7981B / 512M DDR4 / 128M SPI-NAND / USB 3.0)
            - **构建机制**: 官方 ImageBuilder (免源码全编译，全套官方内核驱动)
            - **网口映射**: 完整注入 `02_network` 驱动与首开校准，WAN 绑定 `eth1` (GMAC1)，LAN 严格绑定 `lan1/lan2/lan3` 物理交换口
            - **设备树**: 精准匹配 XR30 物理硬件（状态红白灯、按键、512MB RAM、USB 3.0 XHCI）
            - **透明代理**: 内置 ImmortalWrt 官方 HomeProxy (sing-box 内核,插件全量生成配置,订阅即节点源,与固件同源同版本)
            - **存储扩展**: USB 3.0 + UAS 高速传输 + ext4/vfat/exFAT 自动挂载
            - **性能加速**: 默认开启 MTK PPE 硬件流量分载、Packet Steering 多核中断均衡、TCP BBR
            - **管理界面**: Argon 现代主题 + TTYD 网页终端
          files: release/*
