name: Build ImmortalWrt via ImageBuilder for CMCC XR30

on:
  workflow_dispatch:
  schedule:
    - cron: '0 20 * * 0' # 每周一凌晨 04:00 (北京时间) 自动巡检构建并发布最新版本固件
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IB_URL: https://downloads.immortalwrt.org/releases/25.12-SNAPSHOT/targets/mediatek/filogic/immortalwrt-imagebuilder-25.12-SNAPSHOT-mediatek-filogic.Linux-x86_64.tar.zst
  TZ: Asia/Shanghai

permissions:
  contents: write

jobs:
  build:
    name: Build via ImageBuilder
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set build variables
        id: vars
        run: |
          echo "build_date=$(date +'%Y.%m.%d')" >> $GITHUB_OUTPUT
          echo "release_tag=v25.12-$(date +'%Y%m%d%H%M')" >> $GITHUB_OUTPUT

      - name: Install build tools
        run: |
          sudo apt-get -qq update
          sudo apt-get -qq install zstd libssl-dev libncurses-dev jq

      - name: Download official ImageBuilder
        run: |
          echo "Downloading official ImageBuilder..."
          curl -sL --retry 3 --connect-timeout 10 \
            "${{ env.IB_URL }}" -o ib.tar.zst
          tar -I zstd -xf ib.tar.zst
          rm -f ib.tar.zst
          IB_DIR=$(ls -d immortalwrt-imagebuilder-*)
          echo "IB_DIR=$IB_DIR" >> $GITHUB_ENV
          echo "Extracted to $IB_DIR"

      - name: Inject XR30 profile and device tree
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x "$GITHUB_WORKSPACE/scripts/inject_xr30.sh"
          "$GITHUB_WORKSPACE/scripts/inject_xr30.sh" "$IB_DIR" "$GITHUB_WORKSPACE/dts/image-mt7981b-cmcc-xr30-nand.dtb"

      - name: Build Firmware via ImageBuilder
        run: |
          cd "$IB_DIR"

          chmod +x "$GITHUB_WORKSPACE"/files/etc/uci-defaults/* 2>/dev/null || true

          PACKAGES_LIST="kmod-dummy kmod-nft-socket kmod-nft-tproxy kmod-tun kmod-inet-diag kmod-netlink-diag kmod-tcp-bbr luci luci-i18n-base-zh-cn luci-theme-argon luci-app-ttyd luci-i18n-ttyd-zh-cn curl ca-bundle ip-full momo luci-app-momo luci-i18n-momo-zh-cn sing-box"

          echo "Packaging firmware with pre-integrated Momo and Sing-box..."
          make image PROFILE=cmcc_rax3000m \
            PACKAGES="$PACKAGES_LIST" \
            FILES="$GITHUB_WORKSPACE/files"

      - name: Prepare Release Artifacts
        run: |
          mkdir -p release
          OUTPUT_DIR=$(find "$IB_DIR"/bin -type d -name "filogic" | head -n 1)
          echo "Output directory: $OUTPUT_DIR"
          cd "$OUTPUT_DIR"

          echo "Generated raw files:"
          ls -la *rax3000m* 2>/dev/null || true

          # 将生成的固件与元数据映射为 XR30 专用固件包
          for f in *rax3000m*; do
            [ -f "$f" ] || continue
            TARGET_NAME=$(echo "$f" | sed 's/cmcc_rax3000m/cmcc_xr30-nand/g')
            cp -v "$f" "$GITHUB_WORKSPACE/release/$TARGET_NAME"
          done

          cd "$GITHUB_WORKSPACE/release"

          # 使用 fwtool 与 jq 校验并注入完整合规 metadata，保证全生命周期 sysupgrade 零拦截
          FWTOOL=$(find "$GITHUB_WORKSPACE/$IB_DIR"/staging_dir/host/bin -name "fwtool" 2>/dev/null | head -n 1)
          if [ -x "$FWTOOL" ]; then
            for itb in *.itb; do
              [ -f "$itb" ] || continue
              echo "Inspecting metadata for $itb..."
              "$FWTOOL" -q -i meta.json "$itb" 2>/dev/null || true
              if [ -f meta.json ]; then
                echo "Original metadata:"
                cat meta.json
                # 使用 jq 幂等合并支持的设备列表
                jq '.supported_devices = (["cmcc,xr30-nand", "cmcc,xr30"] + .supported_devices | unique)' meta.json > meta_new.json
                mv -f meta_new.json meta.json
                "$FWTOOL" -m meta.json "$itb"
                rm -f meta.json
                echo "Final secured metadata:"
                "$FWTOOL" -q -i /dev/stdout "$itb" || true
              fi
            done
          fi

          sha256sum * > sha256sums
          ls -la

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.vars.outputs.release_tag }}
          name: "ImmortalWrt 25.12 for CMCC XR30 (${{ steps.vars.outputs.build_date }})"
          body: |
            ### 固件信息
            - **适用设备**: 中国移动 CMCC XR30 (MT7981B / 512M DDR4 / 128M SPI-NAND)
            - **构建机制**: 官方 ImageBuilder (免源码全编译，全套官方内核驱动)
            - **设备树**: 精准匹配 XR30 专用物理硬件（状态红白灯、按键、512MB RAM）
            - **透明代理**: 内置 OpenWrt-momo (`luci-app-momo` + `sing-box` 官方最新稳定版) 及全套内核模块 (`kmod-dummy`, `kmod-nft-socket`, `kmod-nft-tproxy`, `kmod-tun`, `kmod-inet-diag`, `kmod-netlink-diag`)
            - **性能加速**: 默认开启 MTK PPE 硬件流量分载、Packet Steering 多核中断均衡、TCP BBR
            - **管理界面**: Argon 现代主题 + TTYD 网页终端
          files: release/*
